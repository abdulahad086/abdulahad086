ospace" font-size="16" font-weight="400" fill="#a6b6de" text-anchor="start" letter-spacing="0">I explore products like a curious user and an attacker at the same time, then make sure it</text><text x="34" y="286" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="400" fill="#a6b6de" text-anchor="start" letter-spacing="0">stays that way with Playwright suites, API and security checks, k6 load tests and CI</text><text x="34" y="310" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="16" font-weight="400" fill="#a6b6de" text-anchor="start" letter-spacing="0">pipelines anyone can run.</text></svg>